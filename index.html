<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hard RPS AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2315120d'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-size='11' fill='%23fbf6ea' font-family='Arial'%3ERPS%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="game-page" data-page="game">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Hard RPS AI home">
      <span class="mark" aria-hidden="true">RPS</span>
      <span>Hard RPS AI</span>
    </a>
    <nav class="nav-links" aria-label="Primary">
      <a aria-current="page" href="index.html">Play</a>
      <a href="explain.html">How it works</a>
    </nav>
  </header>

  <main class="game-shell">
    <section class="arena" aria-labelledby="arena-title">
      <div class="match-header">
        <div>
          <p class="status-label" id="roundStatus">Round 1</p>
          <h1 id="arena-title">First to 7.</h1>
        </div>
        <div class="match-chip" id="matchState">New match</div>
      </div>

      <div class="score-strip" aria-label="Scoreboard">
        <div><b id="playerScore">0</b><span>You</span></div>
        <div><b id="aiScore">0</b><span>AI</span></div>
      </div>

      <div class="throw-grid" role="group" aria-label="Choose your throw">
        <button class="throw-button rock" type="button" data-move="rock">
          <svg viewBox="0 0 96 96" aria-hidden="true">
            <path d="M20 56c0-18 11-33 28-36 15-3 29 4 33 18 5 16-4 36-19 42-15 7-42 0-42-24Z"/>
            <path d="M31 46c10 5 26 5 37-1M37 62c7 3 17 3 25-1"/>
          </svg>
          <span>Rock</span>
        </button>
        <button class="throw-button paper" type="button" data-move="paper">
          <svg viewBox="0 0 96 96" aria-hidden="true">
            <path d="M29 80h39c5 0 9-4 9-9V22L62 8H29c-5 0-9 4-9 9v54c0 5 4 9 9 9Z"/>
            <path d="M62 8v18h15M34 42h28M34 55h28M34 68h20"/>
          </svg>
          <span>Paper</span>
        </button>
        <button class="throw-button scissors" type="button" data-move="scissors">
          <svg viewBox="0 0 96 96" aria-hidden="true">
            <path d="M30 37a13 13 0 1 1 0-1l36 22"/>
            <path d="M30 59a13 13 0 1 0 0 1l36-22"/>
            <path d="M63 38l17-10M63 58l17 10"/>
          </svg>
          <span>Scissors</span>
        </button>
      </div>

      <div class="result-line" aria-live="polite">
        <span id="playerThrow">You: -</span>
        <strong id="resultText">Choose.</strong>
        <span id="aiThrow">AI: -</span>
      </div>
    </section>

    <aside class="match-panel" aria-labelledby="match-title">
      <div class="panel-heading">
        <p class="status-label">Match</p>
        <h2 id="match-title">Pressure</h2>
      </div>

      <div class="pressure-meter" aria-label="Match pressure">
        <div>
          <span id="pressureLabel">Even</span>
          <b id="pressureValue">0</b>
        </div>
        <meter id="pressureMeter" min="-7" max="7" low="-3" high="3" optimum="7" value="0"></meter>
      </div>

      <dl class="match-stats">
        <div>
          <dt>Streak</dt>
          <dd id="streakValue">0</dd>
        </div>
        <div>
          <dt>Ties</dt>
          <dd id="tieScore">0</dd>
        </div>
        <div>
          <dt>AI read</dt>
          <dd id="readValue">none</dd>
        </div>
      </dl>

      <div class="read-card">
        <span id="trustedModel">Cold read</span>
        <b id="confidenceValue">0%</b>
        <p id="modelReason">No pattern yet.</p>
      </div>

      <div class="controls-row">
        <button class="icon-button" type="button" id="resetGame" aria-label="New match">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6"/>
          </svg>
        </button>
      </div>
    </aside>

    <section class="history-band" aria-labelledby="history-title">
      <div class="panel-heading">
        <p class="status-label">Trace</p>
        <h2 id="history-title">Rounds</h2>
      </div>
      <ol class="round-log" id="roundLog"></ol>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
